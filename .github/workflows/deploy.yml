name: Deploy to cPanel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # The host has no rsync, so stream a tarball over SSH. node_modules is NOT
      # uploaded or touched: install it with the cPanel "Run NPM Install" button.
      - name: Upload build
        run: |
          tar -czf - dist package.json package-lock.json app.cjs | ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ${{ secrets.APP_PATH }} && cd ${{ secrets.APP_PATH }} && rm -rf dist && tar -xzf -"

      - name: Restart app
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ${{ secrets.APP_PATH }}/tmp && touch ${{ secrets.APP_PATH }}/tmp/restart.txt"
